os", "done": false}]}, {"id": "maria-notes", "title": "Notas y pendientes", "type": "notes", "tasks": []}]};const KEY='adultez101-v1';let state;try{const saved=JSON.parse(localStorage.getItem(KEY));state=saved&&Array.isArray(saved.nani)&&Array.isArray(saved.maria)?saved:INITIAL}catch{state=INITIAL}let person='nani',filter='all',search='',collapsed=new Set();const $=s=>document.querySelector(s);const uid=()=>('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}if(window.cloudSave)cloudSave()};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const gs=state[person],all=gs.flatMap(g=>g.tasks),done=all.filter(t=>t.done).length;$('#progress').textContent=`${done} / ${all.length}`;$('#pct').textContent=all.length?Math.round(done/all.length*100)+'%':'0%';$('#fill').style.width=(all.length?done/all.length*100:0)+'%';$('#profileLabel').textContent=person==='nani'?'LISTA DE NANI':'LISTA DE MARÍA';document.querySelectorAll('[data-person]').forEach(b=>b.classList.toggle('active',b.dataset.person===person));document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));const root=$('#sections');root.innerHTML='';let shown=0;gs.forEach(g=>{if(filter==='career'&&g.type!=='career'||filter==='adult'&&g.type!=='adult'||filter==='notes'&&g.type!=='notes')return;const matching=g.tasks.filter(t=>(filter!=='pending'||!t.done)&&t.text.toLowerCase().includes(search));if(search&&!matching.length&&!g.title.toLowerCase().includes(search))return;shown++;const card=document.createElement('section');card.className='card section';const isClosed=collapsed.has(g.id);card.innerHTML=`<div class="sectionhead"><button class="heading" data-action="collapse">${isClosed?'▸':'▾'} ${escapeHtml(g.title)}</button><span class="count">${g.tasks.filter(t=>t.done).length}/${g.tasks.le /* ---- Sincronización entre teléfonos (Firebase) ---- */
(function(){
  const LISTA="fnq627q2mc6gafh6bd5nk4bk";
  const note=$('#syncNotice');
  const say=t=>{note.textContent=t};
  const OK='Los cambios se guardan solos y se ven en el teléfono de Nani y de María. Si quieres, exporta un respaldo de vez en cuando.';
  if(!window.firebase||!window.FIREBASE_CONFIG){say('No se pudo conectar. Los cambios solo se guardan en este teléfono. Revisa tu internet y recarga la página.');return}
  let ref,ready=false,pendingRender=false;
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    const db=firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    ref=db.collection('listas').doc(LISTA);
  }catch(e){say('No se pudo conectar: '+e.message);return}
  const clean=d=>({nani:Array.isArray(d&&d.nani)?d.nani:[],maria:Array.isArray(d&&d.maria)?d.maria:[]});
  const typing=()=>{const a=document.activeElement;return a&&a.tagName==='INPUT'&&a.closest('#sections')&&a.value};
  window.cloudSave=()=>{if(!ready)return;ref.set({...clean(state),actualizado:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>say('No se pudo guardar el último cambio ('+e.code+'). Revisa tu internet.'))};
  document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(render,0)}});
  const explain=e=>{
    if(e&&e.code==='permission-denied')return'Firebase no dio permiso. Revisa que las Reglas de Firestore estén publicadas.';
    if(e&&(e.code==='not-found'||e.code==='failed-precondition'))return'No se encontró la base de datos en Firebase. Revisa que Firestore esté creado con el ID (default).';
    return'No se pudo conectar ('+(e&&e.code||'error')+'). Los cambios se guardan en este teléfono.';
  };
  let creating=false;
  ref.onSnapshot({includeMetadataChanges:true},snap=>{
    if(!snap.exists){
      if(snap.metadata.fromCache||creating)return;
      creating=true;
      ref.firestore.runTransaction(async tx=>{const cur=await tx.get(ref);if(!cur.exists)tx.set(ref,{...clean(state),actualizado:firebase.firestore.FieldValue.serverTimestamp()})})
        .catch(e=>say(explain(e))).finally(()=>{creating=false});
      return;
    }
    ready=true;
    say(snap.metadata.fromCache?'Sin internet: los cambios se guardan y se suben al volver la conexión.':OK);
    if(snap.metadata.hasPendingWrites)return;
    const d=clean(snap.data());
    if(JSON.stringify(d)===JSON.stringify(clean(state)))return;
    state=d;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
    if(typing())pendingRender=true;else render();
  },e=>say(explain(e)));
})();
